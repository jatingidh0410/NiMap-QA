$kind: http-request
url: "{{baseUrl}}/account/authenticate"
method: POST
body:
  type: json
  content: "{\r

    \    \"username\": \"{{valid_email}}\",\r

    \    \"password\": \"{{valid_pass}}\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{auth_token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Login is correctly accepted\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData.success).to.eql(true);\r

      \    pm.expect(jsonData.referralToken).to.be.a('string').and.not.empty; \r

      });\r

      \r

      // Automatically saves the token to your environment variables\r

      var jsonData = pm.response.json();\r

      if(jsonData.referralToken) {\r

      \    pm.environment.set(\"auth_token\", jsonData.referralToken);\r

      }"
    language: text/javascript
order: 2000
