$kind: http-request
name: Login with Invalid Credentials
url: "{{baseUrl}}/account/authenticate"
method: POST
body:
  type: json
  content: "{\r

    \    \"email\": \"{{valid_email}}\",\r

    \    \"password\": \"{{invalid_pass}}\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{auth_token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Login is correctly rejected\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData.success).to.eql(false); \r

      });"
    language: text/javascript
order: 1561
